<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Security Dashboard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            Security Scanner
        </div>

        <nav>

            <button
                class="nav-item active"
                onclick="showTab('upload', this)"
            >
                <span>📤</span>
                Upload
            </button>

            <button
                class="nav-item"
                onclick="showTab('scan', this)"
            >
                <span>🔍</span>
                Scan
            </button>

            <button
                class="nav-item"
                onclick="showTab('report', this)"
            >
                <span>📊</span>
                Report
            </button>

        </nav>

    </aside>


    <!-- Main content -->
    <main class="main-content">

        <header class="topbar">
            <h1>Dashboard</h1>

            <div class="user">
                Admin
            </div>
        </header>


        <!-- Upload -->
        <section
            id="upload"
            class="tab-content active"
        >

            <div class="card">

                <h2>Upload File</h2>

                <p>
                    Upload a file to begin the scanning process.
                </p>

                <form id="uploadForm">

                    <div class="upload-area">

                        <input
                            type="file"
                            id="fileInput"
                            name="file"
                            required
                        >

                        <label for="fileInput">
                            Choose a file
                        </label>

                    </div>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Upload
                    </button>

                </form>

                <div
                    id="uploadMessage"
                    class="message"
                ></div>

            </div>

        </section>


        <!-- Scan -->
        <section
            id="scan"
            class="tab-content"
        >

            <div class="card">

                <h2>Scan</h2>

                <p>
                    Start a security scan against the uploaded file.
                </p>

                <button
                    class="primary-button"
                    onclick="startScan()"
                >
                    Start Scan
                </button>

                <div
                    id="scanMessage"
                    class="message"
                ></div>

            </div>

        </section>


        <!-- Report -->
        <section
            id="report"
            class="tab-content"
        >

            <div class="card">

                <h2>Report</h2>

                <div class="stats">

                    <div class="stat-card">
                        <h3>Status</h3>
                        <p id="reportStatus">-</p>
                    </div>

                    <div class="stat-card">
                        <h3>Files Scanned</h3>
                        <p id="filesScanned">0</p>
                    </div>

                    <div class="stat-card">
                        <h3>Findings</h3>
                        <p id="findings">0</p>
                    </div>

                </div>

                <button
                    class="primary-button"
                    onclick="loadReport()"
                >
                    Refresh Report
                </button>

            </div>

        </section>

    </main>

</div>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>

</body>
</html>
